<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dad Joke of the Day</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
      min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 20px;
    }
    .card {
      background: white; border-radius: 16px; padding: 40px;
      max-width: 600px; width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12); text-align: center;
    }
    .emoji { font-size: 3rem; margin-bottom: 12px; }
    h1 { font-size: 1.4rem; color: #888; margin-bottom: 24px; }
    .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 28px; }
    .tab {
      padding: 8px 20px; border-radius: 20px; border: 2px solid #eee;
      background: #fafafa; color: #888; font-size: 0.9rem; cursor: pointer; transition: all 0.2s;
      text-decoration: none; display: inline-block;
    }
    .tab.active { background: #ff6b35; color: white; border-color: #ff6b35; }
    .category-filter { margin-bottom: 20px; }
    .category-filter select {
      padding: 8px 16px; border-radius: 8px; border: 2px solid #eee;
      font-size: 0.95rem; color: #555; cursor: pointer; outline: none; background: #fafafa;
    }
    .category-filter select:focus { border-color: #ff6b35; }
    #joke-date { font-size: 0.8rem; color: #bbb; margin-bottom: 4px; visibility: hidden; }
    #joke-text {
      font-size: 1.35rem; color: #333; line-height: 1.6;
      min-height: 80px; display: flex; align-items: center;
      justify-content: center; margin-bottom: 14px;
    }
    .meta-row {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; margin-bottom: 24px;
    }
    .badge {
      background: #fff3ec; color: #ff6b35; border: 1px solid #ffd5bf;
      border-radius: 20px; padding: 4px 14px; font-size: 0.8rem;
      font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;
      visibility: hidden;
    }
    .upvote-btn {
      background: #f9f9f9; border: 2px solid #eee; border-radius: 20px;
      padding: 4px 14px; font-size: 0.85rem; color: #888;
      cursor: pointer; transition: all 0.2s; visibility: hidden;
    }
    .upvote-btn:hover { border-color: #ff6b35; color: #ff6b35; background: #fff3ec; }
    .upvote-btn.voted { background: #fff3ec; color: #ff6b35; border-color: #ff6b35; }
    .actions { display: flex; gap: 10px; justify-content: center; margin-bottom: 8px; }
    button.primary {
      background: #ff6b35; color: white; border: none;
      border-radius: 8px; padding: 12px 28px; font-size: 0.95rem;
      cursor: pointer; transition: background 0.2s, transform 0.1s;
    }
    button.primary:hover { background: #e55a26; }
    button.primary:active { transform: scale(0.97); }
    #share-btn {
      background: #f0f0f0; color: #555; border: none; border-radius: 8px;
      padding: 12px 20px; font-size: 0.9rem; cursor: pointer; transition: all 0.2s;
    }
    #share-btn:hover { background: #e0e0e0; }
    #share-btn.copied { background: #d4f5d4; color: #2a7a2a; }
    .loading { color: #aaa; font-style: italic; }
    .archive { margin-top: 36px; text-align: left; }
    .archive h2 { font-size: 1rem; color: #aaa; margin-bottom: 16px; text-align: center; }
    .archive-item {
      background: #fafafa; border-radius: 10px; padding: 14px 18px;
      margin-bottom: 10px; border-left: 4px solid #ffd5bf;
      cursor: pointer; transition: border-color 0.15s;
    }
    .archive-item:hover { border-color: #ff6b35; }
    .archive-date { font-size: 0.75rem; color: #bbb; font-weight: 600; margin-bottom: 4px; }
    .archive-joke { font-size: 0.95rem; color: #555; line-height: 1.5; }
    .archive-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
    .archive-cat { font-size: 0.7rem; color: #ff6b35; font-weight: 600; text-transform: uppercase; }
    .archive-votes { font-size: 0.75rem; color: #bbb; }
    /* reaction bar */
    .reaction-bar {
      display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
      margin-bottom: 20px; visibility: hidden;
    }
    .reaction-btn {
      background: #f9f9f9; border: 2px solid #eee; border-radius: 20px;
      padding: 5px 14px; font-size: 0.95rem; color: #555;
      cursor: pointer; transition: all 0.2s; display: flex;
      align-items: center; gap: 5px; font-family: inherit;
    }
    .reaction-btn:hover { border-color: #ff6b35; background: #fff3ec; }
    .reaction-btn.active { border-color: #ff6b35; background: #fff3ec; color: #ff6b35; font-weight: 700; }
    .reaction-count { font-size: 0.8rem; min-width: 14px; text-align: left; }
    @media (prefers-color-scheme: dark) {
      .reaction-btn { background: #1e1e1e; border-color: #333; color: #ccc; }
      .reaction-btn:hover { border-color: #ff6b35; background: rgba(255,107,53,0.1); }
      .reaction-btn.active { border-color: #ff6b35; background: rgba(255,107,53,0.15); color: #ff6b35; }
    }
    @media (max-width: 480px) {
      .reaction-btn { padding: 5px 10px; font-size: 0.88rem; }
    }
    /* Random joke section */
    .random-joke-section { margin-top: 28px; border-top: 2px solid #f5f5f5; padding-top: 24px; }
    #random-joke-btn {
      background: #fff3ec; color: #ff6b35; border: 2px solid #ffd5bf;
      border-radius: 10px; padding: 12px 28px; font-size: 0.95rem;
      cursor: pointer; transition: all 0.2s; font-family: inherit; font-weight: 600;
    }
    #random-joke-btn:hover { background: #ff6b35; color: white; border-color: #ff6b35; }
    #random-joke-btn:active { transform: scale(0.97); }
    #random-joke-card {
      display: none; margin-top: 20px; background: #fafafa;
      border-radius: 14px; padding: 24px; border: 2px solid #ffecd2;
      text-align: center;
    }
    #random-joke-card.visible { display: block; }
    #random-joke-card.swap-out { opacity: 0; transform: translateY(-8px); transition: opacity 0.15s ease, transform 0.15s ease; }
    #random-joke-card.swap-in  { opacity: 1; transform: translateY(0);  transition: opacity 0.15s ease, transform 0.15s ease; }
    #random-joke-label {
      display: inline-block; background: #ff6b35; color: white;
      border-radius: 20px; padding: 3px 12px; font-size: 0.78rem;
      font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
      margin-bottom: 12px;
    }
    #random-joke-text {
      font-size: 1.2rem; color: #333; line-height: 1.6;
      margin-bottom: 12px;
    }
    #random-joke-text.loading { color: #aaa; font-style: italic; font-size: 1rem; }
    .random-meta-row {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-bottom: 14px; flex-wrap: wrap;
    }
    .random-cat-badge {
      background: #fff3ec; color: #ff6b35; border: 1px solid #ffd5bf;
      border-radius: 20px; padding: 3px 12px; font-size: 0.78rem; font-weight: 600;
      text-transform: uppercase;
    }
    #random-upvote-btn {
      background: #f9f9f9; border: 2px solid #eee; border-radius: 20px;
      padding: 4px 14px; font-size: 0.85rem; color: #888;
      cursor: pointer; transition: all 0.2s; font-family: inherit;
    }
    #random-upvote-btn:hover { border-color: #ff6b35; color: #ff6b35; background: #fff3ec; }
    #random-upvote-btn.voted { background: #fff3ec; color: #ff6b35; border-color: #ff6b35; }
    .random-reaction-bar {
      display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
    }
    @media (prefers-color-scheme: dark) {
      #random-joke-card { background: #1a1a1a; border-color: #7a3b1e; }
      #random-joke-text { color: #e0e0e0; }
      #random-upvote-btn { background: #1e1e1e; border-color: #333; color: #aaa; }
      #random-upvote-btn:hover { border-color: #ff6b35; color: #ff6b35; background: rgba(255,107,53,0.1); }
    }
    @media (max-width: 480px) {
      #random-joke-btn { width: 100%; }
      #random-joke-card { padding: 16px; }
    }
    /* Roast the Joke panel (v19) */
    .roast-panel { margin-top: 20px; border-top: 2px solid #f5f5f5; padding-top: 18px; }
    .roast-toggle {
      background: none; border: 2px dashed #ffd5bf; border-radius: 10px;
      color: #ff6b35; width: 100%; padding: 10px 16px; font-size: 0.93rem;
      font-family: inherit; cursor: pointer; transition: all 0.2s; font-weight: 600;
    }
    .roast-toggle:hover { background: #fff8f3; border-style: solid; }
    .roast-body { margin-top: 14px; text-align: left; }
    .roast-comment {
      background: #fafafa; border-radius: 8px; padding: 10px 14px;
      margin-bottom: 8px; border-left: 3px solid #ffd5bf; font-size: 0.9rem; color: #444;
    }
    .roast-comment-time { font-size: 0.72rem; color: #bbb; margin-top: 3px; }
    .roast-empty { font-size: 0.88rem; color: #bbb; text-align: center; padding: 10px 0 4px; }
    .roast-form { margin-top: 12px; }
    .roast-form textarea {
      width: 100%; border: 2px solid #eee; border-radius: 8px;
      padding: 10px 12px; font-size: 0.9rem; color: #444; font-family: inherit;
      resize: vertical; min-height: 64px; outline: none;
    }
    .roast-form textarea:focus { border-color: #ff6b35; }
    .roast-form-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
    .roast-char-counter { font-size: 0.78rem; color: #bbb; }
    .roast-char-counter.near { color: #ff6b35; }
    .roast-submit-btn {
      background: #ff6b35; color: white; border: none;
      border-radius: 8px; padding: 8px 18px; font-size: 0.88rem;
      cursor: pointer; font-family: inherit;
    }
    .roast-submit-btn:hover { background: #e55a26; }
    .roast-msg { margin-top: 6px; font-size: 0.83rem; min-height: 18px; }
    .roast-msg.ok { color: #2a9d6f; }
    .roast-msg.err { color: #c00; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">😄</div>
    <h1>Dad Joke of the Day</h1>
    <div class="tabs">
      <div class="tab active" id="tab-today" onclick="switchTab('today')">📅 Today's Joke</div>
      <div class="tab" id="tab-random" onclick="switchTab('random')">🎲 Random</div>
      <a class="tab" id="tab-hof" href="/hall-of-fame" data-testid="nav-hall-of-fame">🏆 Hall of Fame</a>
    </div>
    <div id="random-controls" style="display:none" class="category-filter">
      <select id="category-select" onchange="fetchRandom()">
        <option value="">All categories</option>
      </select>
    </div>
    <div id="joke-date"></div>
    <div id="joke-text" class="loading">Loading a joke...</div>
    <div class="meta-row">
      <div id="joke-badge" class="badge">—</div>
      <button class="upvote-btn" id="upvote-btn" onclick="upvote()">👍 <span id="vote-count">0</span></button>
    </div>
    <div class="reaction-bar" id="reaction-bar" role="group" aria-label="Joke reactions">
      <button class="reaction-btn" id="reaction-btn-laugh" data-testid="reaction-btn-laugh" data-reaction="laugh" aria-label="Laugh reaction" aria-pressed="false" onclick="reactToJoke('laugh')">😂 <span class="reaction-count" id="reaction-count-laugh">0</span></button>
      <button class="reaction-btn" id="reaction-btn-groan" data-testid="reaction-btn-groan" data-reaction="groan" aria-label="Groan reaction" aria-pressed="false" onclick="reactToJoke('groan')">😬 <span class="reaction-count" id="reaction-count-groan">0</span></button>
      <button class="reaction-btn" id="reaction-btn-drums" data-testid="reaction-btn-drums" data-reaction="drums" aria-label="Rimshot reaction" aria-pressed="false" onclick="reactToJoke('drums')">🥁 <span class="reaction-count" id="reaction-count-drums">0</span></button>
      <button class="reaction-btn" id="reaction-btn-melt" data-testid="reaction-btn-melt" data-reaction="melt" aria-label="Face melting reaction" aria-pressed="false" onclick="reactToJoke('melt')">🫠 <span class="reaction-count" id="reaction-count-melt">0</span></button>
    </div>
    <!-- streak badge injected by v10 -->
    <div id="streak-badge" data-testid="streak-badge" style="display:none;margin-bottom:16px;">
      🔥 <span data-testid="streak-count" id="streak-count">1</span>-day streak!
      <button id="streak-share-btn" data-testid="streak-share-btn" onclick="shareStreak()" style="margin-left:10px;background:#fff3ec;color:#ff6b35;border:1px solid #ffd5bf;border-radius:16px;padding:4px 14px;font-size:0.8rem;font-weight:600;cursor:pointer;">Share 🔥</button>
    </div>
    <div class="actions">
      <button class="primary" id="action-btn" onclick="onAction()">Another one! 👴</button>
      <button id="share-btn" onclick="shareJoke()">🔗 Share</button>
    </div>
    <!-- Push notification opt-in (v20) -->
    <div id="push-section" style="display:none;margin-top:18px;">
      <button id="push-btn" data-testid="push-btn" onclick="togglePushSubscription()"
        style="background:#fff3ec;color:#ff6b35;border:2px solid #ffd5bf;border-radius:10px;
               padding:10px 22px;font-size:0.9rem;font-family:inherit;font-weight:600;
               cursor:pointer;transition:all 0.2s;width:100%;">
        🔔 Get daily joke notification
      </button>
    </div>
    <!-- Joke Duel panel (v21) -->
    <div id="duel-section" style="margin-top:20px;">
      <button id="duel-toggle" data-testid="duel-toggle"
        onclick="toggleDuelPanel()"
        style="background:#fff8ec;color:#e07b00;border:2px solid #ffd98a;border-radius:10px;
               padding:10px 22px;font-size:0.9rem;font-family:inherit;font-weight:600;
               cursor:pointer;width:100%;text-align:left;">
        ⚔️ Today's duel: vote for the funnier joke!
      </button>
      <div id="duel-panel" data-testid="duel-panel" style="display:none;margin-top:12px;">
        <div id="duel-loading" style="text-align:center;color:#999;padding:18px;">Loading duel…</div>
        <div id="duel-cards" data-testid="duel-cards" style="display:none;">
          <div style="display:flex;gap:14px;flex-wrap:wrap;">
            <div id="duel-card-a" data-testid="duel-card-a"
              style="flex:1;min-width:200px;background:#fffdf5;border:2px solid #ffd98a;
                     border-radius:12px;padding:16px;position:relative;">
              <div id="duel-joke-a" style="font-size:0.95rem;margin-bottom:14px;"></div>
              <button id="duel-vote-a" data-testid="duel-vote-a"
                onclick="duelVote('A')"
                style="background:#ff9f1c;color:#fff;border:none;border-radius:8px;
                       padding:8px 18px;font-size:0.85rem;font-weight:600;cursor:pointer;width:100%;">
                👍 Vote A
              </button>
              <div id="duel-badge-a" data-testid="duel-badge-a" style="display:none;margin-top:8px;text-align:center;font-weight:700;"></div>
            </div>
            <div id="duel-card-b" data-testid="duel-card-b"
              style="flex:1;min-width:200px;background:#fffdf5;border:2px solid #ffd98a;
                     border-radius:12px;padding:16px;position:relative;">
              <div id="duel-joke-b" style="font-size:0.95rem;margin-bottom:14px;"></div>
              <button id="duel-vote-b" data-testid="duel-vote-b"
                onclick="duelVote('B')"
                style="background:#ff9f1c;color:#fff;border:none;border-radius:8px;
                       padding:8px 18px;font-size:0.85rem;font-weight:600;cursor:pointer;width:100%;">
                👍 Vote B
              </button>
              <div id="duel-badge-b" data-testid="duel-badge-b" style="display:none;margin-top:8px;text-align:center;font-weight:700;"></div>
            </div>
          </div>
          <div id="duel-result-msg" data-testid="duel-result-msg" style="display:none;margin-top:14px;text-align:center;color:#888;font-size:0.85rem;"></div>
        </div>
      </div>
    </div>
    <!-- Random joke section (v18) -->
    <div class="random-joke-section">
      <button id="random-joke-btn" data-testid="random-joke-btn" onclick="fetchRandomJoke()">🎲 Random Joke</button>
      <div id="random-joke-card" data-testid="random-joke-card">
        <span id="random-joke-label" data-testid="random-joke-label">🎲 Random</span>
        <div id="random-joke-text"></div>
        <div class="random-meta-row">
          <span class="random-cat-badge" id="random-cat-badge"></span>
          <button id="random-upvote-btn" onclick="upvoteRandom()">👍 <span id="random-vote-count">0</span></button>
        </div>
        <div class="random-reaction-bar" id="random-reaction-bar" role="group" aria-label="Random joke reactions">
          <button class="reaction-btn" id="random-reaction-btn-laugh" data-reaction="laugh" aria-label="Laugh" aria-pressed="false" onclick="reactToRandom('laugh')">😂 <span class="reaction-count" id="random-reaction-count-laugh">0</span></button>
          <button class="reaction-btn" id="random-reaction-btn-groan" data-reaction="groan" aria-label="Groan" aria-pressed="false" onclick="reactToRandom('groan')">😬 <span class="reaction-count" id="random-reaction-count-groan">0</span></button>
          <button class="reaction-btn" id="random-reaction-btn-drums" data-reaction="drums" aria-label="Rimshot" aria-pressed="false" onclick="reactToRandom('drums')">🥁 <span class="reaction-count" id="random-reaction-count-drums">0</span></button>
          <button class="reaction-btn" id="random-reaction-btn-melt" data-reaction="melt" aria-label="Face melting" aria-pressed="false" onclick="reactToRandom('melt')">🫠 <span class="reaction-count" id="random-reaction-count-melt">0</span></button>
        </div>
      </div>
    </div>
    <!-- Roast the Joke panel (v19) -->
    <div id="roast-panel" class="roast-panel" style="display:none">
      <button class="roast-toggle" id="roast-toggle" data-testid="roast-toggle" onclick="toggleRoast()" aria-expanded="false">
        💬 Roast the Joke <span id="roast-count-badge" data-testid="roast-count-badge"></span>
      </button>
      <div class="roast-body" id="roast-body" style="display:none">
        <div id="roast-list" data-testid="roast-list"></div>
        <form class="roast-form" id="roast-form" onsubmit="submitRoast(event)">
          <textarea id="roast-input" data-testid="roast-input" maxlength="280" placeholder="Your roast here…" rows="3"></textarea>
          <div class="roast-form-footer">
            <span class="roast-char-counter" id="roast-char-counter" data-testid="roast-char-counter">0 / 280</span>
            <button type="submit" class="roast-submit-btn" data-testid="roast-submit-btn">Roast it 🔥</button>
          </div>
          <div id="roast-msg" data-testid="roast-msg" class="roast-msg"></div>
        </form>
      </div>
    </div>
    <div class="archive" id="archive-section">
      <h2>📖 Last 7 Days</h2>
      <div id="archive-list"></div>
    </div>
  </div>

  <script>
    let currentTab = 'today';
    let currentJokeId = null;

    async function loadCategories() {
      try {
        const cats = await (await fetch('/api/categories')).json();
        const sel = document.getElementById('category-select');
        cats.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c; opt.textContent = c.charAt(0).toUpperCase() + c.slice(1);
          sel.appendChild(opt);
        });
      } catch(e) {}
    }

    function showJoke(data, isToday) {
      document.getElementById('joke-text').className = '';
      document.getElementById('joke-text').textContent = data.joke;
      document.getElementById('joke-badge').textContent = data.category;
      document.getElementById('joke-badge').style.visibility = 'visible';
      document.getElementById('upvote-btn').style.visibility = 'visible';
      document.getElementById('upvote-btn').classList.remove('voted');
      document.getElementById('vote-count').textContent = data.votes || 0;
      currentJokeId = data.id;
      // Render reactions
      const bar = document.getElementById('reaction-bar');
      bar.style.visibility = 'visible';
      const rxns = data.reactions || { laugh: 0, groan: 0, drums: 0, melt: 0 };
      ['laugh','groan','drums','melt'].forEach(r => {
        document.getElementById('reaction-count-' + r).textContent = rxns[r] || 0;
        const btn = document.getElementById('reaction-btn-' + r);
        btn.classList.remove('active');
        btn.setAttribute('aria-pressed', 'false');
      });
      // Restore local selection if any
      const stored = localStorage.getItem('djotd_reaction_' + data.id);
      if (stored) {
        const btn = document.getElementById('reaction-btn-' + stored);
        if (btn) { btn.classList.add('active'); btn.setAttribute('aria-pressed', 'true'); }
      }
      history.replaceState(null, '', `#joke-${data.id}`);
      // v19: show roast panel for this joke
      if (typeof window.showRoastPanel === 'function') window.showRoastPanel(data.id);
      const dateEl = document.getElementById('joke-date');
      if (data.date) { dateEl.textContent = data.date; dateEl.style.visibility = 'visible'; }
      else dateEl.style.visibility = 'hidden';
      // Challenge Mode: only for today's joke
      if (isToday && typeof window.initChallenge === 'function') {
        window.initChallenge(data);
      } else {
        // Remove challenge section when viewing non-today jokes
        var cs = document.getElementById('challenge-section');
        if (cs) cs.remove();
      }
    }

    async function reactToJoke(reaction) {
      if (!currentJokeId) return;
      try {
        const res = await fetch(`/api/jokes/${currentJokeId}/react`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reaction })
        });
        const data = await res.json();
        if (!res.ok) return;
        const rxns = data.reactions || {};
        ['laugh','groan','drums','melt'].forEach(r => {
          document.getElementById('reaction-count-' + r).textContent = rxns[r] || 0;
          const btn = document.getElementById('reaction-btn-' + r);
          const active = data.userReaction === r;
          btn.classList.toggle('active', active);
          btn.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
        if (data.userReaction) {
          localStorage.setItem('djotd_reaction_' + currentJokeId, data.userReaction);
        } else {
          localStorage.removeItem('djotd_reaction_' + currentJokeId);
        }
      } catch(e) {}

  <script>
  (function() {
    let roastJokeId = null;
    let roastOpen = false;

    function timeAgo(iso) {
      const s = Math.floor((Date.now() - new Date(iso)) / 1000);
      if (s < 60) return 'just now';
      const m = Math.floor(s / 60);
      if (m < 60) return m + 'm ago';
      const h = Math.floor(m / 60);
      if (h < 24) return h + 'h ago';
      return Math.floor(h / 24) + 'd ago';
    }

    async function loadRoasts(jokeId) {
      const list = document.getElementById('roast-list');
      try {
        const res = await fetch(`/api/jokes/${jokeId}/comments`);
        const comments = await res.json();
        const badge = document.getElementById('roast-count-badge');
        badge.textContent = comments.length > 0 ? `(${comments.length})` : '';
        if (!comments.length) {
          list.innerHTML = '<div class="roast-empty">Be the first to roast this one.</div>';
          return;
        }
        list.innerHTML = comments.map(c => `
          <div class="roast-comment">
            <div>${escapeHtml(c.text)}</div>
            <div class="roast-comment-time">${timeAgo(c.createdAt)}</div>
          </div>`).join('');
      } catch(e) {
        list.innerHTML = '<div class="roast-empty">Failed to load comments.</div>';
      }
    }

    function escapeHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    window.toggleRoast = function() {
      roastOpen = !roastOpen;
      const body = document.getElementById('roast-body');
      const btn = document.getElementById('roast-toggle');
      body.style.display = roastOpen ? 'block' : 'none';
      btn.setAttribute('aria-expanded', roastOpen ? 'true' : 'false');
      if (roastOpen && roastJokeId) loadRoasts(roastJokeId);

    window.showRoastPanel = function(jokeId) {

      body.style.display = 'none';
      btn.setAttribute('aria-expanded', 'false');
      input.value = '';
      msg.textContent = ''; msg.className = 'roast-msg';
      document.getElementById('roast-char-counter').textContent = '0 / 280';
      // Preload count for badge even when collapsed
      fetch(`/api/jokes/${jokeId}/comments`).then(r => r.json()).then(comments => {
        badge.textContent = comments.length > 0 ? `(${comments.length})` : '';
      }).catch(() => {});
    };

    window.submitRoast = async function(e) {
      e.preventDefault();
      const input = document.getElementById('roast-input');
      const msg = document.getElementById('roast-msg');
      const text = input.value.trim();
      msg.className = 'roast-msg'; msg.textContent = '';
      if (!text) { msg.className = 'roast-msg err'; msg.textContent = 'Write something first!'; return; }
      try {
        const res = await fetch(`/api/jokes/${roastJokeId}/comments`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        const data = await res.json();
        if (res.ok) {
          msg.className = 'roast-msg ok';
          msg.textContent = "\ud83d\udd25 Your roast is in the queue!";
          input.value = '';
          document.getElementById('roast-char-counter').textContent = '0 / 280';
        } else {
          msg.className = 'roast-msg err';
          msg.textContent = data.error || 'Failed to submit.';
        }
      } catch(e) {
        msg.className = 'roast-msg err'; msg.textContent = 'Failed to submit. Try again.';
      }
    };

    // Char counter
    document.addEventListener('DOMContentLoaded', function() {
      const input = document.getElementById('roast-input');
      if (input) {
        input.addEventListener('input', function() {
          const len = input.value.length;
          const counter = document.getElementById('roast-char-counter');
          counter.textContent = `${len} / 280`;
          counter.className = 'roast-char-counter' + (len > 250 ? ' near' : '');
        });
      }
    });
  })();

  <!-- Push Notifications JS (v20) -->
  <script>
  (function () {
    const PUSH_SUB_KEY = 'djotd_push_subscribed';
    let swReg = null;
    let vapidPublicKey = null;

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
    }

    function setPushBtnState(subscribed) {
      const btn = document.getElementById('push-btn');
      if (!btn) return;
      if (subscribed) {
        btn.textContent = '\ud83d\udd15 Unsubscribe from notifications';
        btn.style.background = '#f0f0f0';
        btn.style.color = '#888';
        btn.style.borderColor = '#ddd';
      } else {
        btn.textContent = '\ud83d\udd14 Get daily joke notification';
        btn.style.background = '#fff3ec';
        btn.style.color = '#ff6b35';
        btn.style.borderColor = '#ffd5bf';
      }
    }

    async function initPush() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
      try {
        const keyRes = await fetch('/api/push/vapid-public-key');
        const keyData = await keyRes.json();
        vapidPublicKey = keyData.publicKey;
        swReg = await navigator.serviceWorker.register('/sw.js');
        // Show button
        document.getElementById('push-section').style.display = 'block';
        // Restore state from localStorage
        const stored = localStorage.getItem(PUSH_SUB_KEY);
        setPushBtnState(stored === '1');
      } catch (e) {}
    }

    window.togglePushSubscription = async function () {
      if (!swReg || !vapidPublicKey) return;
      const subscribed = localStorage.getItem(PUSH_SUB_KEY) === '1';
      if (subscribed) {
        // Unsubscribe
        try {
          const sub = await swReg.pushManager.getSubscription();
          if (sub) {
            await fetch('/api/push/unsubscribe', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ endpoint: sub.endpoint })
            });
            await sub.unsubscribe();
          }
          localStorage.removeItem(PUSH_SUB_KEY);
          setPushBtnState(false);
        } catch (e) {}
      } else {
        // Subscribe
        try {
          const permission = await Notification.requestPermission();
          if (permission !== 'granted') return;
          const sub = await swReg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(vapidPublicKey)
          });
          await fetch('/api/push/subscribe', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(sub)
          });
          localStorage.setItem(PUSH_SUB_KEY, '1');
          setPushBtnState(true);
        } catch (e) {}
      }
    };

    document.addEventListener('DOMContentLoaded', initPush);
  })();
  </script>

    document.getElementById('search-results').innerHTML = '';
    document.getElementById('search-input').value = '';
  };
})();
</script>

<script>
(function () {
  document.addEventListener('DOMContentLoaded', function () {
    const card = document.querySelector('.card');
    if (!card) return;

    const section = document.createElement('div');
    section.className = 'digest-section';
    section.innerHTML = `
      <h3>📬 Weekly Joke Digest</h3>
      <p>Get the top 5 dad jokes of the week delivered to your inbox every Friday.</p>
      <div class="digest-row">
        <input id="digest-email" type="email" placeholder="you@example.com" />
        <button class="digest-btn" id="digest-sub-btn">Subscribe</button>
        <button class="digest-btn unsub" id="digest-unsub-btn">Unsubscribe</button>
      </div>
      <div class="digest-msg" id="digest-msg"></div>`;
    card.appendChild(section);

    async function callDigest(path) {
      const email = document.getElementById('digest-email').value.trim();
      const msg   = document.getElementById('digest-msg');
      msg.className = 'digest-msg';
      msg.textContent = '';
      if (!email) { msg.className = 'digest-msg err'; msg.textContent = 'Please enter an email address.'; return; }
      try {
        const res  = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
        const data = await res.json();
        msg.className = 'digest-msg ' + (res.ok ? 'ok' : 'err');
        msg.textContent = data.message || data.error;
        if (res.ok) document.getElementById('digest-email').value = '';
      } catch (e) {
        msg.className = 'digest-msg err'; msg.textContent = 'Request failed. Please try again.';
      }
    }

    document.getElementById('digest-sub-btn').addEventListener('click',   () => callDigest('/api/subscribe'));
    document.getElementById('digest-unsub-btn').addEventListener('click', () => callDigest('/api/unsubscribe'));

</script>

<script>
(function () {
  var LS_LAST  = 'djotd_lastVisit';
  var LS_STREAK = 'djotd_streak';

  function todayStr() {
    return new Date().toISOString().slice(0, 10);
  }

  function initStreak() {
    var lastVisit     = localStorage.getItem(LS_LAST)   || null;
    var currentStreak = parseInt(localStorage.getItem(LS_STREAK) || '0', 10);
    var today         = todayStr();
    var result        = computeStreak(lastVisit, currentStreak, today);
    localStorage.setItem(LS_LAST,   result.lastVisit);
    localStorage.setItem(LS_STREAK, String(result.streak));
    var badge = document.getElementById('streak-badge');
    var count = document.getElementById('streak-count');
    if (badge && count) {
      count.textContent = result.streak;
      badge.style.display = 'block';
    }
  }

  window.shareStreak = function () {
    var streak = localStorage.getItem(LS_STREAK) || '1';
    var text   = '🔥 I\'m on a ' + streak + '-day Dad Joke streak! Join me at ' + window.location.origin;
    if (navigator.share) {
      navigator.share({ title: 'Dad Joke Streak', text: text, url: window.location.origin })
        .catch(function () {});
    } else {
      navigator.clipboard.writeText(text).then(function () {
        var btn = document.getElementById('streak-share-btn');
        var orig = btn.textContent;
        btn.textContent = '✅ Copied!';
        setTimeout(function () { btn.textContent = orig; }, 2000);
      }).catch(function () {
        prompt('Copy your streak message:', text);
      });
    }
  };

  document.addEventListener('DOMContentLoaded', initStreak);
})();
</script>

<script>
(function () {
  document.addEventListener('DOMContentLoaded', function () {
    const card = document.querySelector('.card');
    if (!card) return;

    const section = document.createElement('div');
    section.className = 'top-jokes-section';
    section.innerHTML = `
      <button class="top-jokes-toggle" data-testid="top-jokes-toggle" onclick="toggleTopJokes(this)" aria-expanded="false">
        <span>🏆 Top this week</span>
        <em class="toggle-arrow">▼</em>
      </button>
      <div class="top-jokes-list" data-testid="top-jokes-list" id="top-jokes-list"></div>`;

    // Insert before submit section (or search, or digest) if present; else append
    const before = card.querySelector('.submit-section') || card.querySelector('.search-section') || card.querySelector('.digest-section');
    if (before) card.insertBefore(section, before);
    else card.appendChild(section);

    // Pre-fetch on page load so panel opens instantly
    fetchTopJokes();
  });

  var _topJokesCache = null;

  async function fetchTopJokes() {
    try {
      const data = await (await fetch('/api/jokes/top')).json();
      _topJokesCache = data;
      renderTopJokes(data);
    } catch (e) {
      _topJokesCache = [];
    }
  }

  function renderTopJokes(jokes) {
    const list = document.getElementById('top-jokes-list');
    if (!list) return;
    if (!jokes || jokes.length === 0) {
      list.innerHTML = '<div class="top-jokes-empty">No votes yet — be the first to upvote a joke!</div>';
      return;
    }
    list.innerHTML = jokes.map(j =>
      `<div class="top-joke-item" data-testid="top-joke-${j.id}">
        <span class="top-joke-text">${j.joke.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span>
        <span class="top-joke-votes">(👍 ${j.votes})</span>
      </div>`
    ).join('');
  }

  window.toggleTopJokes = function (btn) {
    const list = document.getElementById('top-jokes-list');
    if (!list) return;
    const isOpen = list.classList.toggle('open');
    btn.classList.toggle('open', isOpen);
    btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  };
})();
</script>
