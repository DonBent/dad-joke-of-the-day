<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏆 Joke of the Year — Dad Joke of the Day</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #fffdf9; color: #333; min-height: 100vh; padding: 24px 16px 40px; }
    .container { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.5rem; font-weight: 700; color: #e07b00; margin-bottom: 6px; }
    .subtitle { font-size: 0.85rem; color: #aaa; margin-bottom: 20px; }
    .year-row { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
    .year-row label { font-size: 0.85rem; color: #777; }
    select { font-family: inherit; font-size: 0.88rem; padding: 5px 10px; border: 1.5px solid #ffd5bf; border-radius: 8px; background: #fff; color: #333; cursor: pointer; }
    .trophy-card { background: #fff; border: 2px solid #ffb347; border-radius: 14px; padding: 22px 20px; margin-bottom: 18px; box-shadow: 0 2px 12px rgba(255,179,71,0.10); }
    .trophy-icon { font-size: 2rem; margin-bottom: 8px; }
    .trophy-joke { font-size: 1.05rem; line-height: 1.5; color: #222; margin-bottom: 14px; }
    .trophy-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .cat-badge { background: #fff3e0; color: #e07b00; border-radius: 6px; font-size: 0.75rem; font-weight: 600; padding: 2px 10px; }
    .net-score { background: #e8f5e9; color: #388e3c; border-radius: 6px; font-size: 0.78rem; font-weight: 700; padding: 2px 10px; }
    .vote-breakdown { font-size: 0.78rem; color: #999; }
    .share-btn { display: inline-block; margin-top: 14px; background: none; border: 1.5px solid #ffb347; border-radius: 8px; padding: 6px 16px; font-size: 0.85rem; color: #b35c00; font-family: inherit; cursor: pointer; transition: background 0.15s; }
    .share-btn:hover { background: #fff3e0; }
    .empty-state { text-align: center; padding: 40px 20px; }
    .empty-state p { font-size: 0.9rem; color: #bbb; margin-bottom: 12px; }
    .empty-state a { color: #ffb347; text-decoration: none; font-size: 0.85rem; }
    .back-link { font-size: 0.8rem; color: #ccc; margin-bottom: 18px; display: block; }
    .back-link a { color: #ffb347; text-decoration: none; }
    .heading-year { color: #e07b00; }
  </style>
</head>
<body>
  <div class="container">
    <a class="back-link" href="/">← Back to today's joke</a>
    <h1>🏆 Joke of the Year</h1>
    <p class="subtitle">The highest net-voted joke of the year</p>

    <div class="year-row">
      <label for="year-selector">Year:</label>
      <select id="year-selector" data-testid="year-selector"></select>
    </div>

    <div id="best-of-year-empty" data-testid="best-of-year-empty" class="empty-state" style="display:none">
      <p>No votes recorded for <span id="empty-year"></span> yet — <a href="/">go vote!</a></p>
    </div>

    <div id="best-of-year-content" style="display:none">
      <h2 id="year-heading" style="font-size:1.1rem;color:#555;margin-bottom:14px;"></h2>
      <div class="trophy-card">
        <div class="trophy-icon">🏆</div>
        <div class="trophy-joke" id="trophy-joke"></div>
        <div class="trophy-meta">
          <span class="cat-badge" id="trophy-cat"></span>
          <span class="net-score" id="trophy-net"></span>
        </div>
        <div class="vote-breakdown" id="trophy-breakdown"></div>
        <button class="share-btn" id="share-best-of-year" data-testid="share-best-of-year">🔗 Share</button>
      </div>
    </div>
  </div>

  <script>
  (function () {
    const START_YEAR = 2026;
    const now = new Date().getFullYear();
    const sel = document.getElementById('year-selector');

    // Populate year selector
    for (let y = START_YEAR; y <= now; y++) {
      const opt = document.createElement('option');
      opt.value = y;
      opt.textContent = y;
      sel.appendChild(opt);
    }

    // Read ?year= from URL
    const params = new URLSearchParams(window.location.search);
    const urlYear = parseInt(params.get('year'));
    if (urlYear >= START_YEAR && urlYear <= now) sel.value = urlYear;
    else sel.value = now;

    async function load(year) {
      const emptyEl = document.getElementById('best-of-year-empty');
      const contentEl = document.getElementById('best-of-year-content');
      const emptyYearEl = document.getElementById('empty-year');
      emptyEl.style.display = 'none';
      contentEl.style.display = 'none';
      try {
        const res = await fetch(`/api/jokes/best-of-year?year=${year}`);
        if (!res.ok) {
          emptyEl.style.display = '';
          if (emptyYearEl) emptyYearEl.textContent = year;
          return;
        }
        const data = await res.json();
        const w = data.winner;
        document.getElementById('year-heading').textContent = `${data.year}'s Groaner of the Year 🏆`;
        document.getElementById('trophy-joke').textContent = w.joke;
        document.getElementById('trophy-cat').textContent = w.category;
        document.getElementById('trophy-net').textContent = `Net score: +${w.netScore}`;
        document.getElementById('trophy-breakdown').textContent = `${w.upvotes} 👍 · ${w.downvotes} 👎`;
        const shareBtn = document.getElementById('share-best-of-year');
        shareBtn.onclick = async () => {
          const text = `${data.year}'s Groaner of the Year 🏆: ${w.joke} — ${location.origin}/best-of-year?year=${data.year}`;
          if (navigator.share) {
            try { await navigator.share({ title: `${data.year} Groaner of the Year`, text }); } catch {}
          } else {
            try { await navigator.clipboard.writeText(text); shareBtn.textContent = '✅ Copied!'; setTimeout(() => { shareBtn.textContent = '🔗 Share'; }, 1800); } catch {}
          }
        };
        contentEl.style.display = '';
      } catch {
        emptyEl.style.display = '';
        if (emptyYearEl) emptyYearEl.textContent = year;
      }
    }

    sel.addEventListener('change', () => load(parseInt(sel.value)));
    load(parseInt(sel.value));
  })();
  </script>
</body>
</html>
